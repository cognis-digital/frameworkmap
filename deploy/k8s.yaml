apiVersion: apps/v1
kind: Deployment
metadata: { name: frameworkmap, labels: { app: frameworkmap } }
spec:
  replicas: 1
  selector: { matchLabels: { app: frameworkmap } }
  template:
    metadata: { labels: { app: frameworkmap } }
    spec:
      containers:
        - name: frameworkmap
          image: ghcr.io/cognis-digital/frameworkmap:latest
          ports: [{ containerPort: 8000 }]
          resources:
            requests: { cpu: "50m", memory: "64Mi" }
            limits: { cpu: "500m", memory: "256Mi" }
---
apiVersion: v1
kind: Service
metadata: { name: frameworkmap }
spec:
  selector: { app: frameworkmap }
  ports: [{ port: 80, targetPort: 8000 }]
